<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QuickServe | Register</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f9ff;
      padding: 20px;
    }

    .auth-box {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,.08);
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .auth-logo .logo-icon {
      margin: auto auto 10px;
    }

    .auth-box h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .auth-subtitle {
      text-align: center;
      color: #667085;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .auth-box label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin: 15px 0 6px;
    }

    .auth-box input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      outline: none;
    }

    .auth-box input:focus {
      border-color: #5267e8;
    }

    .register-btn {
      width: 100%;
      padding: 13px;
      margin-top: 22px;
      background: #5267e8;
      color: white;
      border-radius: 8px;
      font-weight: 700;
    }

    .register-btn:hover {
      background: #4054d0;
    }

    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #667085;
    }

    .auth-footer a {
      color: #5267e8;
      font-weight: 700;
    }
  </style>
</head>

<body>

  <div class="auth-page">

    <div class="auth-box">

      <div class="auth-logo">
        <div class="logo-icon">Q</div>
        <strong>QuickServe</strong>
      </div>

      <h1>Create Account</h1>

      <p class="auth-subtitle">
        Join QuickServe and book trusted local services.
      </p>

      <form id="registerForm">

        <label>Full Name</label>
        <input
          type="text"
          id="name"
          placeholder="Enter your full name"
          required
        >

        <label>Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >

        <label>Password</label>
        <input
          type="password"
          id="password"
          placeholder="Create a password"
          minlength="6"
          required
        >

        <button type="submit" class="register-btn">
          Create Account
        </button>

      </form>

      <div class="auth-footer">
        Already have an account?
        <a href="login.html">Login</a>
      </div>

    </div>

  </div>

  <script type="module" src="auth.js"></script>

</body>
</html>
